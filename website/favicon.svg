<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
    <linearGradient id="kali-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55a5ff"/>
      <stop offset="100%" stop-color="#0066eb"/>
    </linearGradient>
    <linearGradient id="traffic-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5f57"/>
      <stop offset="100%" stop-color="#e0443e"/>
    </linearGradient>
    <linearGradient id="traffic-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#febc2e"/>
      <stop offset="100%" stop-color="#d89e24"/>
    </linearGradient>
    <linearGradient id="traffic-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28c840"/>
      <stop offset="100%" stop-color="#1aab29"/>
    </linearGradient>
  </defs>

  <!-- App icon squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Window Header traffic light dots -->
  <circle cx="14" cy="14" r="3.2" fill="url(#traffic-red)"/>
  <circle cx="23" cy="14" r="3.2" fill="url(#traffic-yellow)"/>
  <circle cx="32" cy="14" r="3.2" fill="url(#traffic-green)"/>

  <!-- Divider line -->
  <line x1="8" y1="22" x2="56" y2="22" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Terminal prompt command symbol: >_ styled with Kali cyan-blue -->
  <path d="M16 32 L26 39 L16 46" fill="none" stroke="url(#kali-blue)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="46" x2="48" y2="46" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
