name: macKali Release Packaging & Verification

"on":
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release to GitHub Releases (false only uploads workflow artifacts)'
        required: true
        type: boolean
        default: false
      draft:
        description: 'Create GitHub Release as draft'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-verify-release:
    name: Build, Verify & Package Release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ""
      RELEASE_TAG: ""
      IS_PRERELEASE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system testing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dconf-cli libglib2.0-bin jq dbus-x11 gsettings-desktop-schemas

      - name: Validate version consistency
        id: version-check
        run: |
          RAW_VER="$(tr -d '[:space:]' < VERSION)"
          AUTHORITATIVE_VER="${RAW_VER#v}"
          echo "Authoritative VERSION file: '${AUTHORITATIVE_VER}' (raw: '${RAW_VER}')"
          
          if [ -z "$AUTHORITATIVE_VER" ]; then
            echo "::error::VERSION file is empty or missing."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_VER="${TAG_NAME#v}"
            echo "Triggered by tag: '${TAG_NAME}' (parsed version: '${TAG_VER}')"
            if [ "$TAG_VER" != "$AUTHORITATIVE_VER" ]; then
              echo "::error::Tag '${TAG_NAME}' does not match repository VERSION '${AUTHORITATIVE_VER}'! Refusing to release."
              exit 1
            fi
            RELEASE_TAG="${TAG_NAME}"
          else
            RELEASE_TAG="v${AUTHORITATIVE_VER}"
            echo "Triggered via workflow_dispatch. Targeting tag '${RELEASE_TAG}'"
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
              if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "::error::Tag '${RELEASE_TAG}' already exists pointing to commit ${TAG_SHA}, but workflow is running on ${GITHUB_SHA}! Refusing to proceed."
                exit 1
              fi
            fi
          fi

          # Detect prerelease flag
          if [[ "$AUTHORITATIVE_VER" =~ -(rc|beta|alpha) ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "RELEASE_VERSION=${AUTHORITATIVE_VER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"
          echo "release_version=${AUTHORITATIVE_VER}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Verify shell script permissions & syntax
        run: |
          chmod +x install.sh build.sh scripts/*.sh scripts/lib/*.sh scripts/providers/*.sh themes/cursors/*.sh tests/*.sh
          bash -n install.sh build.sh scripts/*.sh scripts/lib/*.sh scripts/providers/*.sh themes/cursors/*.sh tests/*.sh

      - name: Run automated test suite
        run: |
          dbus-run-session -- ./tests/run-tests.sh

      - name: Package release archive & generate checksums
        run: |
          ./scripts/package-release.sh --output-dir dist
          ls -lh dist/

      - name: Upload release artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mackali-${{ steps.version-check.outputs.release_tag }}-artifacts
          path: dist/
          retention-days: 14

      - name: Publish to GitHub Releases
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
          RELEASE_TAG: ${{ steps.version-check.outputs.release_tag }}
          IS_PRERELEASE: ${{ steps.version-check.outputs.is_prerelease }}
        run: |
          DRAFT_FLAG=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Guard against accidental overwrites: Never overwrite existing releases
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists on GitHub! Existing releases cannot be overwritten."
            exit 1
          fi

          echo "Creating GitHub Release $RELEASE_TAG linked to commit $GITHUB_SHA..."
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "macKali $RELEASE_TAG" \
            --generate-notes \
            $DRAFT_FLAG \
            $PRERELEASE_FLAG
