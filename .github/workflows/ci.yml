name: macKali CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    name: Lint, Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system testing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dconf-cli libglib2.0-bin jq

      - name: Verify shell script permissions & syntax
        run: |
          chmod +x install.sh build.sh scripts/*.sh scripts/providers/*.sh themes/cursors/*.sh tests/*.sh
          bash -n install.sh build.sh scripts/*.sh scripts/providers/*.sh themes/cursors/*.sh tests/*.sh

      - name: Run automated test suite
        run: |
          ./tests/run-tests.sh

      - name: Test root entry points
        run: |
          ./install.sh --help
          ./install.sh --check
          ./install.sh --dry-run
