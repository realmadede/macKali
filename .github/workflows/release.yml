name: macKali Release Packaging & Verification

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release to GitHub Releases (false only uploads workflow artifacts)'
        required: true
        type: boolean
        default: false
      draft:
        description: 'Create GitHub Release as draft'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-verify-release:
    name: Build, Verify & Package Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system testing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dconf-cli libglib2.0-bin jq dbus-x11

      - name: Validate version consistency
        id: version-check
        run: |
          RAW_VER="$(tr -d '[:space:]' < VERSION)"
          AUTHORITATIVE_VER="${RAW_VER#v}"
          echo "Authoritative VERSION file: '${AUTHORITATIVE_VER}' (raw: '${RAW_VER}')"
          
          if [ -z "$AUTHORITATIVE_VER" ]; then
            echo "::error::VERSION file is empty or missing."
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            TAG_VER="${TAG_NAME#v}"
            echo "Triggered by tag: '${TAG_NAME}' (parsed version: '${TAG_VER}')"
            if [ "$TAG_VER" != "$AUTHORITATIVE_VER" ]; then
              echo "::error::Tag '${TAG_NAME}' does not match repository VERSION '${AUTHORITATIVE_VER}'! Refusing to release."
              exit 1
            fi
            RELEASE_TAG="${TAG_NAME}"
          else
            RELEASE_TAG="v${AUTHORITATIVE_VER}"
            echo "Triggered via workflow_dispatch. Targeting tag '${RELEASE_TAG}'"
          fi

          # Detect prerelease flag
          if [[ "$AUTHORITATIVE_VER" =~ -(rc|beta|alpha) ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          echo "RELEASE_VERSION=${AUTHORITATIVE_VER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_ENV"

      - name: Verify shell script permissions & syntax
        run: |
          chmod +x install.sh build.sh scripts/*.sh scripts/providers/*.sh themes/cursors/*.sh tests/*.sh
          bash -n install.sh build.sh scripts/*.sh scripts/providers/*.sh themes/cursors/*.sh tests/*.sh

      - name: Run automated test suite
        run: |
          dbus-run-session -- ./tests/run-tests.sh

      - name: Package release archive & generate checksums
        run: |
          ./scripts/package-release.sh --output-dir dist

      - name: Upload release artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mackali-${{ env.RELEASE_TAG }}-artifacts
          path: dist/
          retention-days: 14

      - name: Publish to GitHub Releases
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT_FLAG=""
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.draft == true }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Check if release already exists to prevent duplicate failures
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading/updating assets..."
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            echo "Creating GitHub Release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" dist/* \
              --title "macKali $RELEASE_TAG" \
              --generate-notes \
              $DRAFT_FLAG \
              $PRERELEASE_FLAG
          fi
